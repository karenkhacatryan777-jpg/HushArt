<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HushArt Armenian Top Store Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-extra.css"></head><body><main class="admin"><h1>HushArt Armenian Top Store · Կառավարման բաժին</h1><section id="login" class="panel"><h2>Մուտք</h2><form id="login-form"><label>Գաղտնաբառ<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary">Մուտք</button><p id="login-status" role="status"></p></form></section><section id="dashboard" hidden><button id="logout">Դուրս գալ</button><div class="admin-grid"><div class="panel"><h2>Ավելացնել / խմբագրել աշխատանք</h2><form id="work-form"><input type="hidden" name="id"><label>Անվանում<input name="title" required maxlength="160"></label><label>Կոդ<input name="code" maxlength="60"></label><label>Կատեգորիա<select name="category"><option value="monuments">Հուշարձաններ</option><option value="khachkars">Խաչքարեր</option><option value="engraving">Փորագրություն</option><option value="sculptures">Քանդակներ</option><option value="graves">Գերեզմանների կառուցում</option><option value="restoration">Վերականգնում</option></select></label><label>Նյութ<input name="material"></label><label>Չափսեր<input name="dimensions"></label><label>Նկարագրություն<textarea name="description"></textarea></label><label>Լուսանկարներ (մինչև 5 հատ, 5 ՄԲ յուրաքանչյուրն)<input id="work-files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label>Լուսանկարների հասցեներ (յուրաքանչյուրն առանձին տողով)<textarea name="images" rows="3"></textarea></label><label><input name="featured" type="checkbox"> Գլխավոր էջում ընտրված</label><button class="btn primary">Պահպանել</button><p id="work-status" role="status"></p></form></div><div class="panel"><h2>Աշխատանքներ</h2><div id="works-list" class="scroll"></div></div></div><div class="panel" style="margin-top:20px"><h2>Պատվերներ</h2><div id="orders-list" class="scroll"></div></div><div class="panel" style="margin-top:20px"><h2>Սակագների կարգավորումներ</h2><p>Թողեք {}՝ մինչև հաստատված սակագներ սահմանելը։ Արժեքները չեն ցուցադրվում հանրային կայքում։</p><form id="pricing-form"><textarea id="pricing-config" rows="6" aria-label="Սակագների JSON"></textarea><button class="btn primary">Պահպանել</button><p id="pricing-status" role="status"></p></form></div></section></main><script src="site-extra.js"></script><script src="admin.js"></script></body></html>
